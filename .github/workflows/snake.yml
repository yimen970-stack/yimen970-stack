name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # በየ 12 ሰዓቱ ይሰራል
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          # እዚህ ጋር አዲሱን Username ህን ማስገባት አለብህ
          github_user_name: yimen970-stack
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v31 የሚለውን ወደ v3.1.0 ወይም v4 ቀይረው
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
